# Kia Seltos SP2PE Gen5W HUD Mini Telemetry Configuration
# CAN Data Interface: HMG-API (/dev/hmgapi / hmgapid)

[hud]
enabled=1
refresh_interval_sec=3
display_duration_sec=4
hud_position=top_center
translucent_mode=1

[sensors]
# 1. Battery Voltage Monitoring (AGM / Alternator state)
battery_voltage=1
voltage_low_warn=11.8
voltage_high_warn=14.8

# 2. Engine Thermal Management
coolant_temp=1
coolant_high_warn=105.0
oil_temp=1
oil_high_warn=115.0

# 3. TPMS Tire Pressures (psi)
tpms_monitoring=1
tpms_target_psi=35
tpms_low_warn=30

[controls]
# Steering wheel custom button (★) hook
star_button_toggle=1
long_press_duration_ms=800
trigger_file=/data/local/tmp/seltos_hud_toggle
