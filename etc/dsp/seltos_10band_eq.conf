# Kia Seltos SP2PE Gen5W Acoustic Tuning Profile
# Target: Cabin resonance compensation & Road noise masking offset
# Preamp: -1.5 dB (prevents digital clipping on boosted frequencies)

[preamp]
gain_db=-1.5

[equalizer]
bands=10
# Band 1: Deep Sub-Bass (31.5 Hz)
band.0.freq=31.5
band.0.gain=3.0
band.0.q=1.414

# Band 2: Kick & Bass Punch (63 Hz)
band.1.freq=63.0
band.1.gain=4.5
band.1.q=1.200

# Band 3: Cruising Road Noise Compensation (125 Hz)
band.2.freq=125.0
band.2.gain=3.0
band.2.q=1.000

# Band 4: Door Trim Resonance Reduction (250 Hz)
band.3.freq=250.0
band.3.gain=-1.0
band.3.q=1.414

# Band 5: Vocal Body (500 Hz)
band.4.freq=500.0
band.4.gain=0.0
band.4.q=1.000

# Band 6: Harsh Navigation Peak Reduction (1000 Hz)
band.5.freq=1000.0
band.5.gain=-1.5
band.5.q=1.414

# Band 7: Vocal Sibilance / Fatigue Softening (2000 Hz)
band.6.freq=2000.0
band.6.gain=-1.0
band.6.q=1.414

# Band 8: Snare & Instrument Presence (4000 Hz)
band.7.freq=4000.0
band.7.gain=1.5
band.7.q=1.200

# Band 9: High-Frequency Sparkle (8000 Hz)
band.8.freq=8000.0
band.8.gain=3.0
band.8.q=1.000

# Band 10: Ultra-High Acoustic Air (16000 Hz)
band.9.freq=16000.0
band.9.gain=4.0
band.9.q=0.707

[loudness]
enabled=1
fletcher_munson=1
bass_boost_db=3.5
treble_boost_db=2.0
speed_volume_comp=1
