# Kia Seltos SP2PE Stock 6-Speaker Acoustic Tuning Profile (v1.3.1 Final)
# Target: Stock 6-Speaker Hardware Optimization, Door Trim Resonance Suppression & Anti-Gain-Stacking Headroom
# Preamp: -5.0 dB (Prevents +0.39 dB clipping from 8kHz/16kHz filter skirt stacking, keeping peak at -0.61 dBFS)

[preamp]
gain_db=-5.0

[equalizer]
bands=10
# Band 1: Infrasonic Roll-off / Cone Protection (31.5 Hz, Butterworth Low-shelf Q=0.7)
band.0.freq=31.5
band.0.gain=-2.0
band.0.q=0.700

# Band 2: Kick & Sub-Bass Punch Focus (63.0 Hz, Q=1.1)
band.1.freq=63.0
band.1.gain=3.5
band.1.q=1.100

# Band 3: Low-Mid Warmth & Booming Suppression (125 Hz, Q=1.2)
band.2.freq=125.0
band.2.gain=1.5
band.2.q=1.200

# Band 4: Door Trim Boxy Resonance Notch (250 Hz, Q=1.8 Pinpoint Cut)
band.3.freq=250.0
band.3.gain=-1.0
band.3.q=1.800

# Band 5: Vocal Body & Warmth Flat Reference (500 Hz, Q=1.0)
band.4.freq=500.0
band.4.gain=0.0
band.4.q=1.000

# Band 6: Harsh Navigation Peak Reduction (1000 Hz, Q=1.2 Anti-Scoop)
band.5.freq=1000.0
band.5.gain=-1.0
band.5.q=1.200

# Band 7: Vocal Presence & Sibilance Softening (2000 Hz, Q=1.4)
band.6.freq=2000.0
band.6.gain=-0.5
band.6.q=1.400

# Band 8: Snare & Instrument Detail Brightness (4000 Hz, Q=1.2)
band.7.freq=4000.0
band.7.gain=1.0
band.7.q=1.200

# Band 9: Cymbal & Treble Air (8000 Hz, Q=1.1)
band.8.freq=8000.0
band.8.gain=3.0
band.8.q=1.100

# Band 10: Ultra-High Acoustic Shimmer (16000 Hz, Q=1.4 Peak Suppression)
band.9.freq=16000.0
band.9.gain=3.5
band.9.q=1.400

[loudness]
enabled=1
fletcher_munson=1
bass_boost_db=2.5
treble_boost_db=1.5
speed_volume_comp=1
